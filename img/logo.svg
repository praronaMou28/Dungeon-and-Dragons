<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="krishiLogoBg" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="55%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#0E7A52"/>
    </radialGradient>
    <linearGradient id="krishiLeaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4FBF6"/>
      <stop offset="100%" stop-color="#EAF7EE"/>
    </linearGradient>
  </defs>

  <circle cx="50" cy="50" r="48" fill="url(#krishiLogoBg)"/>

  <!-- sun rays, upper right -->
  <g stroke="#FEF3C7" stroke-width="2.6" stroke-linecap="round" opacity="0.85">
    <line x1="68" y1="18" x2="68" y2="10"/>
    <line x1="78" y1="24" x2="84" y2="18"/>
    <line x1="82" y1="34" x2="90" y2="32"/>
  </g>
  <circle cx="68" cy="30" r="9" fill="#FEF3C7"/>

  <!-- grain / wheat stem rising from base -->
  <path d="M50 82 C 49 66, 51 54, 50 40" stroke="#0E7A52" stroke-width="3" fill="none" stroke-linecap="round"/>
  <g fill="#FBBF24">
    <ellipse cx="44" cy="46" rx="5.5" ry="3.4" transform="rotate(-35 44 46)"/>
    <ellipse cx="56" cy="46" rx="5.5" ry="3.4" transform="rotate(35 56 46)"/>
    <ellipse cx="43" cy="55" rx="5.5" ry="3.4" transform="rotate(-35 43 55)"/>
    <ellipse cx="57" cy="55" rx="5.5" ry="3.4" transform="rotate(35 57 55)"/>
    <ellipse cx="42" cy="64" rx="5.5" ry="3.4" transform="rotate(-35 42 64)"/>
    <ellipse cx="58" cy="64" rx="5.5" ry="3.4" transform="rotate(35 58 64)"/>
    <ellipse cx="50" cy="38" rx="4.6" ry="6.4"/>
  </g>

  <!-- leaf wrapping the base, main brand mark -->
  <path d="M50 84
           C 26 84, 14 68, 16 48
           C 34 50, 46 60, 50 84 Z"
        fill="url(#krishiLeaf)"/>
  <path d="M18 50 C 30 54, 42 62, 49 80" stroke="#0E7A52" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.55"/>

  <path d="M50 84
           C 74 84, 87 66, 84 45
           C 64 48, 52 58, 50 84 Z"
        fill="#0E7A52" opacity="0.92"/>
  <path d="M82 47 C 70 52, 58 62, 50 80" stroke="#F4FBF6" stroke-width="1.6" fill="none" stroke-linecap="round" opacity="0.5"/>
</svg>
